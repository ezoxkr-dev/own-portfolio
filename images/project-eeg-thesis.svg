<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="eegBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#eegBg)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Header -->
    <rect width="720" height="44" rx="16" fill="#131d35" />
    <rect y="28" width="720" height="16" fill="#131d35" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="42" cy="22" r="5" fill="#f59e0b" />
    <circle cx="60" cy="22" r="5" fill="#10b981" />
    <text x="90" y="27" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="bold">EEG Emotion Recognition &bull; Hybrid CNN-Transformer Architecture (SEED &amp; DEAP)</text>

    <!-- Scalp Topography & Waveforms Layout -->
    <!-- Left panel: Scalp 10-20 system -->
    <g transform="translate(25, 60)">
      <rect width="210" height="335" rx="12" fill="#070b14" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">10-20 ELECTRODE TOPOMAP</text>
      
      <!-- Scalp Circle -->
      <circle cx="105" cy="140" r="75" fill="#0b1324" stroke="#38bdf8" stroke-width="2" />
      <!-- Nose indicator -->
      <polygon points="105,58 98,65 112,65" fill="#38bdf8" />
      <!-- Ears -->
      <path d="M 28 135 C 25 125, 25 155, 28 145" stroke="#38bdf8" stroke-width="2" fill="none" />
      <path d="M 182 135 C 185 125, 185 155, 182 145" stroke="#38bdf8" stroke-width="2" fill="none" />

      <!-- Electrodes -->
      <g fill="#38bdf8" font-family="sans-serif" font-size="8" text-anchor="middle">
        <circle cx="105" cy="80" r="7" fill="#ef4444" /><text x="105" y="83" fill="#fff">Fpz</text>
        <circle cx="75" cy="105" r="7" fill="#38bdf8" /><text x="75" y="108" fill="#fff">F3</text>
        <circle cx="135" cy="105" r="7" fill="#38bdf8" /><text x="135" y="108" fill="#fff">F4</text>
        <circle cx="105" cy="140" r="8" fill="#a855f7" /><text x="105" y="143" fill="#fff">Cz</text>
        <circle cx="60" cy="140" r="7" fill="#38bdf8" /><text x="60" y="143" fill="#fff">C3</text>
        <circle cx="150" cy="140" r="7" fill="#38bdf8" /><text x="150" y="143" fill="#fff">C4</text>
        <circle cx="105" cy="190" r="7" fill="#10b981" /><text x="105" y="193" fill="#fff">Pz</text>
      </g>

      <text x="16" y="250" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold">Extracted Bands:</text>
      <text x="16" y="270" fill="#94a3b8" font-family="sans-serif" font-size="10">&bull; Theta (4-8 Hz) &bull; Alpha (8-13 Hz)</text>
      <text x="16" y="288" fill="#94a3b8" font-family="sans-serif" font-size="10">&bull; Beta (14-30 Hz) &bull; Gamma (30-45 Hz)</text>
      <text x="16" y="315" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">PyTorch &bull; 62-ch Biosemi</text>
    </g>

    <!-- Right panel: Neural Pipeline & Confusion Matrix -->
    <g transform="translate(250, 60)">
      <rect width="445" height="335" rx="12" fill="#070b14" stroke="#1e293b" stroke-width="1" />
      <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">PIPELINE ARCHITECTURE &amp; ATTENTION HEATMAP</text>

      <!-- Waveform preview -->
      <g transform="translate(20, 45)">
        <text x="0" y="10" fill="#64748b" font-family="monospace" font-size="10">Raw EEG Signal (Filtered 0.5-50 Hz):</text>
        <path d="M 0 35 Q 25 15, 50 35 T 100 35 T 150 10 T 200 45 T 250 20 T 300 40 T 350 25 T 400 35" fill="none" stroke="url(#waveGrad)" stroke-width="2" />
      </g>

      <!-- 3 Stage Architecture Block -->
      <g transform="translate(20, 115)">
        <!-- Stage 1 -->
        <rect x="0" y="0" width="125" height="75" rx="8" fill="#131d35" stroke="#3b82f6" stroke-width="1" />
        <text x="12" y="22" fill="#93c5fd" font-family="sans-serif" font-size="10" font-weight="bold">1D-CNN Layers</text>
        <text x="12" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9">Temporal &amp; Spatial</text>
        <text x="12" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9">Feature Extraction</text>

        <!-- Arrow -->
        <text x="133" y="42" fill="#64748b" font-family="sans-serif" font-size="14">&rarr;</text>

        <!-- Stage 2 -->
        <rect x="150" y="0" width="125" height="75" rx="8" fill="#1e183a" stroke="#8b5cf6" stroke-width="1" />
        <text x="162" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="10" font-weight="bold">Transformer</text>
        <text x="162" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9">Multi-Head Self-Attn</text>
        <text x="162" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9">Long-range Dynamics</text>

        <!-- Arrow -->
        <text x="283" y="42" fill="#64748b" font-family="sans-serif" font-size="14">&rarr;</text>

        <!-- Stage 3 -->
        <rect x="300" y="0" width="105" height="75" rx="8" fill="#0d2620" stroke="#10b981" stroke-width="1" />
        <text x="310" y="22" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="bold">Classifier</text>
        <text x="310" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9">Positive / Neutral /</text>
        <text x="310" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9">Negative Emotion</text>
      </g>

      <!-- Accuracy metrics & validation -->
      <g transform="translate(20, 220)">
        <rect width="405" height="95" rx="8" fill="#0e172a" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Empirical Evaluation Results:</text>
        
        <g transform="translate(16, 45)" font-family="sans-serif" font-size="11">
          <text fill="#cbd5e1">SEED Dataset (Subject-Independent):</text>
          <text x="235" fill="#38bdf8" font-weight="bold">92.4% Accuracy</text>
        </g>
        <g transform="translate(16, 68)" font-family="sans-serif" font-size="11">
          <text fill="#cbd5e1">DEAP Valence / Arousal Classification:</text>
          <text x="235" fill="#34d399" font-weight="bold">88.7% Accuracy</text>
        </g>
      </g>
    </g>
  </g>
</svg>
