<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#sysBg)" />

  <g transform="translate(40, 30)">
    <rect width="720" height="420" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Top terminal bar -->
    <rect width="720" height="40" rx="16" fill="#1e293b" />
    <rect y="24" width="720" height="16" fill="#1e293b" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
    <text x="90" y="24" fill="#94a3b8" font-family="monospace" font-size="12">ezox-core-daemon &bull; system optimization &bull; kernel hook v4.3</text>

    <!-- Metrics Cards Row -->
    <g transform="translate(25, 55)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="155" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">TARGET FPS</text>
      <text x="14" y="52" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="900">120 <tspan font-size="12" fill="#64748b">Hz</tspan></text>
      <text x="14" y="66" fill="#10b981" font-family="sans-serif" font-size="9">▲ Stable 0.2% jitter</text>

      <!-- Metric 2 -->
      <rect x="170" y="0" width="155" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="184" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">NETWORK PING</text>
      <text x="184" y="52" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="900">14 <tspan font-size="12" fill="#64748b">ms</tspan></text>
      <text x="184" y="66" fill="#10b981" font-family="sans-serif" font-size="9">TCP/UDP direct bypass</text>

      <!-- Metric 3 -->
      <rect x="340" y="0" width="155" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="354" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">KERNEL DRIVER</text>
      <text x="354" y="52" fill="#a855f7" font-family="sans-serif" font-size="18" font-weight="800">Undetected</text>
      <text x="354" y="66" fill="#a855f7" font-family="sans-serif" font-size="9">Driver memory masked</text>

      <!-- Metric 4 -->
      <rect x="510" y="0" width="155" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="524" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">TELEGRAM SUBSCRIBERS</text>
      <text x="524" y="52" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="900">8.2k+</text>
      <text x="524" y="66" fill="#94a3b8" font-family="sans-serif" font-size="9">t.me/ezoxbypass active</text>
    </g>

    <!-- Graph & Telemetry Screen -->
    <g transform="translate(25, 145)">
      <rect width="665" height="150" rx="12" fill="#080c14" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">Real-Time Frame Pacing &amp; Memory Read Latency</text>
      
      <!-- Graph Line -->
      <path d="M 30 110 Q 100 80, 160 100 T 260 70 T 360 85 T 460 65 T 560 75 T 640 60" fill="none" stroke="#06b6d4" stroke-width="2.5" />
      <!-- Baseline -->
      <line x1="30" y1="120" x2="640" y2="120" stroke="#1e293b" stroke-dasharray="4" />
      <line x1="30" y1="80" x2="640" y2="80" stroke="#1e293b" stroke-dasharray="4" />
      <line x1="30" y1="45" x2="640" y2="45" stroke="#1e293b" stroke-dasharray="4" />
      <text x="645" y="64" fill="#06b6d4" font-family="monospace" font-size="10">8.2ms</text>
    </g>

    <!-- Logs & Events Feed -->
    <g transform="translate(25, 310)">
      <rect width="665" height="90" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <g fill="#94a3b8" font-family="monospace" font-size="11" transform="translate(16, 22)">
        <text y="0"><tspan fill="#34d399">[READY]</tspan> Ezox Kernel Service v4.3 initialized with anti-heuristics protection</text>
        <text y="22"><tspan fill="#38bdf8">[HOOK]</tspan> Direct memory offset calibrated for LDPlayer9 &amp; Gameloop 7.1</text>
        <text y="44"><tspan fill="#a855f7">[BOT]</tspan> Telegram Webhook listener active &bull; Auto key generation ready</text>
      </g>
    </g>
  </g>
</svg>
